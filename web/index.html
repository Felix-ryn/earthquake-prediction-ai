<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Peta Visualisasi Earthquake Pipeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    .legend {
      background: white;
      padding: 8px 10px;
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
      font-size: 12px;
      line-height: 1.4;
    }
    .legend div {
      margin-bottom: 4px;
    }
    .legend span.swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      border-radius: 2px;
      vertical-align: middle;
    }

    .eval-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 9999;
      background: #1d3557;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .eval-toggle:hover {
      background: #2a9d8f;
    }
    .eval-panel {
      position: absolute;
      top: 52px;
      right: 10px;
      z-index: 9999;
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100vh - 72px);
      overflow-y: auto;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.3);
      padding: 12px 14px;
      font-size: 12px;
      display: none;
    }
    .eval-panel.open {
      display: block;
    }
    .eval-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .eval-title {
      font-size: 15px;
      font-weight: 700;
      color: #1d3557;
    }
    .eval-close {
      background: #eef2f7;
      color: #334155;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .eval-close:hover {
      background: #dbe3ec;
    }
    .eval-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .eval-tab {
      background: #eef2f7;
      color: #334155;
      border: none;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .eval-tab:hover {
      background: #dbe3ec;
    }
    .eval-tab.active {
      background: #1d3557;
      color: #ffffff;
    }
    .eval-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 6px;
      margin-bottom: 12px;
    }
    .eval-card {
      background: #f1f5f9;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .eval-card .label {
      display: block;
      color: #64748b;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .eval-card .value {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }
    .eval-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .eval-mode {
      background: #2a9d8f;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .eval-mode:hover {
      background: #21867a;
    }
    .cm-wrap {
      overflow-x: auto;
    }
    .cm-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 11px;
    }
    .cm-table th,
    .cm-table td {
      border: 1px solid #e2e8f0;
      padding: 4px;
      text-align: center;
      min-width: 34px;
    }
    .cm-table th {
      background: #f8fafc;
      color: #334155;
      font-weight: 600;
    }
    .cm-table .cm-axis {
      background: #eef2f7;
      font-weight: 700;
      white-space: nowrap;
    }
    .cm-table .cm-corner {
      background: #ffffff;
      font-size: 10px;
      color: #64748b;
    }
    .cm-table .cm-diag {
      outline: 2px solid #1d3557;
      outline-offset: -2px;
      font-weight: 700;
    }
    .eval-note {
      margin-top: 8px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <button id="eval-toggle" class="eval-toggle" type="button">Evaluasi Model</button>

  <div id="eval-panel" class="eval-panel">
    <div class="eval-header">
      <span class="eval-title">Evaluasi Model</span>
      <button id="eval-close" class="eval-close" type="button">Tutup</button>
    </div>
    <div id="eval-tabs" class="eval-tabs"></div>
    <div id="eval-metrics" class="eval-metrics"></div>
    <div class="eval-toolbar">
      <span><b>Tabel Confusion Matrix</b></span>
      <button id="cm-mode-toggle" class="eval-mode" type="button">Tampilkan Persentase</button>
    </div>
    <div id="cm-wrap" class="cm-wrap"></div>
    <div id="eval-note" class="eval-note"></div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Polyline Decorator -->
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    

  <script>
    // ======================
    // CONFIG: PATH GEOJSON
    // ======================
    const LAYER_CONFIGS = {
      rawEvents: {
        name: "Events Raw",
        url: "data/events_raw.geojson",  // SESUAIKAN
        color: "#666666"
      },
      acoEvents: {
        name: "ACO Events",
        url: "data/events_aco.geojson",  // SESUAIKAN
        color: "#e63946"
      },
      gaVectors: {
        name: "GA Vectors",
        url: "data/ga_vectors.geojson",   // SESUAIKAN
        color: "#457b9d"
      },
      roi: {
        name: "Predicted ROI",
        url: "data/inference_roi.geojson", // SESUAIKAN
        color: "#2a9d8f"
      }
    };

    // ======================
    // INIT MAP
    // ======================
    const map = L.map("map", {
      center: [-8.0, 112.0], // kira-kira Jawa Timur
      zoom: 7
    });

    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
    }).addTo(map);

    const baseLayers = { "OpenStreetMap": osm };
    const overlays = {};
    const boundsAccumulator = [];

    // ======================
    // HELPER FUNCTIONS
    // ======================

    function addBounds(layer) {
      try {
        const b = layer.getBounds();
        if (b.isValid()) {
          boundsAccumulator.push(b);
        }
      } catch (e) {
        // no-op
      }
    }

    function combineBounds(boundsArray) {
      if (!boundsArray.length) return null;
      let combined = boundsArray[0];
      for (let i = 1; i < boundsArray.length; i++) {
        combined = combined.extend(boundsArray[i]);
      }
      return combined;
    }

    function formatNumber(x, digits = 2) {
      if (x === null || x === undefined) return "-";
      const n = Number(x);
      if (Number.isNaN(n)) return "-";
      return n.toFixed(digits);
    }

    // ======================
    // RAW EVENTS LAYER
    // ======================
    function loadRawEvents() {
      const cfg = LAYER_CONFIGS.rawEvents;
      const layer = L.layerGroup();
      overlays[cfg.name] = layer;

      fetch(cfg.url)
        .then(res => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(geojson => {
          const gj = L.geoJSON(geojson, {
            pointToLayer: (feature, latlng) => {
              const props = feature.properties || {};
              const mag = props.magnitude;
              const radius = mag ? 2 + Math.max(0, (mag - 2) * 1.5) : 3;
              return L.circleMarker(latlng, {
                radius,
                color: cfg.color,
                weight: 1,
                fillColor: cfg.color,
                fillOpacity: 0.5
              });
            },
            onEachFeature: (feature, layerItem) => {
              const p = feature.properties || {};
              const dt = p.datetime || "-";
              const mag = formatNumber(p.magnitude);
              const depth = formatNumber(p.depth_km);
              const type = p.type || "-";
              layerItem.bindPopup(
                `<b>Raw Event</b><br>` +
                `Datetime: ${dt}<br>` +
                `Type: ${type}<br>` +
                `Magnitude: ${mag}<br>` +
                `Depth: ${depth} km`
              );
            }
          }).addTo(layer);

          addBounds(gj);
        })
        .catch(err => {
          console.warn("Failed to load raw events:", err);
        });
    }

    // ======================
    // ACO EVENTS LAYER
    // ======================
    function loadACOEvents() {
      const cfg = LAYER_CONFIGS.acoEvents;
      const layer = L.layerGroup();
      overlays[cfg.name] = layer;

      fetch(cfg.url)
        .then(res => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(geojson => {
          const gj = L.geoJSON(geojson, {
            pointToLayer: (feature, latlng) => {
              const p = feature.properties || {};
              const radiusKm = p.radius_km || 5;
              // Circle (area) untuk radius, marker kecil di tengah
              const circle = L.circle(latlng, {
                radius: radiusKm * 1000,
                color: cfg.color,
                weight: 1,
                fillColor: cfg.color,
                fillOpacity: 0.08
              });
              const marker = L.circleMarker(latlng, {
                radius: 3,
                color: cfg.color,
                weight: 1,
                fillColor: cfg.color,
                fillOpacity: 0.7
              });
              const group = L.featureGroup([circle, marker]);
              return group;
            },
            onEachFeature: (feature, layerItem) => {
              const p = feature.properties || {};
              const dt = p.datetime || "-";
              const mag = formatNumber(p.magnitude);
              const depth = formatNumber(p.depth_km);
              const type = p.type || "-";
              const hazard = formatNumber(p.hazard_eta);
              const tau = formatNumber(p.tau_norm);
              const radius = formatNumber(p.radius_km);
              const area = formatNumber(p.area_km2);

              layerItem.bindPopup(
                `<b>ACO Event</b><br>` +
                `Datetime: ${dt}<br>` +
                `Type: ${type}<br>` +
                `Magnitude: ${mag}<br>` +
                `Depth: ${depth} km<br>` +
                `Hazard η: ${hazard}<br>` +
                `τ_norm: ${tau}<br>` +
                `Radius: ${radius} km<br>` +
                `Area: ${area} km²`
              );
            }
          }).addTo(layer);

          addBounds(gj);
        })
        .catch(err => {
          console.warn("Failed to load ACO events:", err);
        });
    }

    // ======================
    // GA VECTORS LAYER
    // ======================
    function loadGAVectors() {
      const cfg = LAYER_CONFIGS.gaVectors;
      const layer = L.layerGroup();
      overlays[cfg.name] = layer;

      fetch(cfg.url)
        .then(res => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(geojson => {
          const gj = L.geoJSON(geojson, {
            style: feature => {
              const p = feature.properties || {};
              const type = p.type || "";
              let color = cfg.color;
              if (type === "volcanic") color = "#ff7f0e";
              else if (type === "tectonic") color = "#1f77b4";
              return {
                color,
                weight: 2,
                opacity: 0.9
              };
            },
            onEachFeature: (feature, layerItem) => {
              const p = feature.properties || {};
              const type = p.type || "-";
              const theta = formatNumber(p.theta_deg);
              const dir = p.direction || "-";
              const mode = p.mode || "ga";
              const freq = p.freq || "-";
              const period = p.period || "-";

              layerItem.bindPopup(
                `<b>GA Vector</b><br>` +
                `Type: ${type}<br>` +
                `Mode: ${mode}<br>` +
                `Freq: ${freq}, Period: ${period}<br>` +
                `Theta: ${theta}°<br>` +
                `Direction: ${dir}`
              );
            }
          }).addTo(layer);

          // === Tambah arrow head di ujung garis menggunakan polylineDecorator ===
          // === Tambah arrow head di ujung garis menggunakan polylineDecorator ===
                    const decorator = L.polylineDecorator(gj, {
                      patterns: [
                        {
                          offset: '100%',      // posisi arrow di ujung garis
                          repeat: 0,           // jangan diulang-ulang
                          symbol: L.Symbol.arrowHead({
                            pixelSize: 36,
                            headAngle: 45,
                            polygon: true,
                            pathOptions: {
                              // pakai warna yang sama dengan garis
                              color: '#457b9d',
                              weight: 2,
                              opacity: 0.9,
                              renderer: L.svg()
                            }
                          })
                        }
                      ]
                    }).addTo(layer);
          addBounds(gj);
        })
        .catch(err => {
          console.warn("Failed to load GA vectors:", err);
        });
    }

    // ======================
    // ROI PREDICTION LAYER
    // ======================
    function loadROI() {
      const cfg = LAYER_CONFIGS.roi;
      const layer = L.layerGroup();
      overlays[cfg.name] = layer;

      fetch(cfg.url)
        .then(res => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(geojson => {
          const gj = L.geoJSON(geojson, {
            style: feature => ({
              color: cfg.color,
              weight: 2,
              fillColor: cfg.color,
              fillOpacity: 0.15
            }),
            onEachFeature: (feature, layerItem) => {
              const p = feature.properties || {};
              const model = p.model || "-";
              const seqLen = p.seq_len ?? p.seq_len ?? "-";
              const theta = p.pred_theta_deg ?? p.pred_theta_deg ?? p.pred_theta_raw_deg;
              const thetaStr = theta != null ? formatNumber(theta) : "-";
              const dir = p.pred_direction || "-";
              const step = formatNumber(p.pred_step_km);
              const radius = formatNumber(p.pred_roi_radius_km);
              const lastDt = p.last_datetime || "-";
              const lastType = p.last_type || "-";
              const lastMag = formatNumber(p.last_magnitude);
              const lastHazard = formatNumber(p.last_hazard_eta);
              const lastTau = formatNumber(p.last_tau_norm);

              layerItem.bindPopup(
                `<b>Predicted ROI</b><br>` +
                `Model: ${model}<br>` +
                `Seq len: ${seqLen}<br>` +
                `Pred θ: ${thetaStr}°<br>` +
                `Direction: ${dir}<br>` +
                `Step: ${step} km<br>` +
                `ROI radius: ${radius} km<br><hr>` +
                `<b>Last Event</b><br>` +
                `Datetime: ${lastDt}<br>` +
                `Type: ${lastType}<br>` +
                `Magnitude: ${lastMag}<br>` +
                `Hazard η: ${lastHazard}<br>` +
                `τ_norm: ${lastTau}`
              );
            }
          }).addTo(layer);

          addBounds(gj);
        })
        .catch(err => {
          console.warn("Failed to load ROI:", err);
        });
    }

    // ======================
    // LEGEND
    // ======================
    function addLegend() {
      const legend = L.control({ position: "bottomright" });

      legend.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = `
          <div><b>Legenda</b></div>
          <div><span class="swatch" style="background:${LAYER_CONFIGS.rawEvents.color}"></span>Events Raw</div>
          <div><span class="swatch" style="background:${LAYER_CONFIGS.acoEvents.color}"></span>ACO Events (radius & hazard)</div>
          <div><span class="swatch" style="background:${LAYER_CONFIGS.gaVectors.color}"></span>GA Vectors (arah klaster)</div>
          <div><span class="swatch" style="background:${LAYER_CONFIGS.roi.color}"></span>Predicted ROI</div>
        `;
        return div;
      };

      legend.addTo(map);
    }

    // ======================
    // EVALUATION PANEL
    // ======================
    const EVAL_METRICS_URL = "data/metrics_models.json";
    const EVAL_CLASSES_DEFAULT = ["E", "NE", "N", "NW", "W", "SW", "S", "SE"];
    const EVAL_MODEL_LABELS = { NB: "Naive Bayes", CNN: "CNN", LSTM: "LSTM" };

    let evalData = null;
    let evalCurrentModel = "NB";
    let evalNormalized = false;

    function formatPct(x) {
      if (x === null || x === undefined) return "-";
      const n = Number(x);
      if (Number.isNaN(n)) return "-";
      return (n * 100).toFixed(1) + "%";
    }

    function initEvalPanel() {
      const toggle = document.getElementById("eval-toggle");
      const panel = document.getElementById("eval-panel");
      const close = document.getElementById("eval-close");
      const modeToggle = document.getElementById("cm-mode-toggle");

      if (!toggle || !panel) return;

      L.DomEvent.disableClickPropagation(toggle);
      L.DomEvent.disableScrollPropagation(toggle);
      L.DomEvent.disableClickPropagation(panel);
      L.DomEvent.disableScrollPropagation(panel);

      toggle.addEventListener("click", () => panel.classList.toggle("open"));
      close.addEventListener("click", () => panel.classList.remove("open"));

      modeToggle.addEventListener("click", () => {
        evalNormalized = !evalNormalized;
        modeToggle.textContent = evalNormalized
          ? "Tampilkan Jumlah"
          : "Tampilkan Persentase";
        renderConfusionMatrix();
      });

      loadEvalMetrics();
    }

    function loadEvalMetrics() {
      fetch(EVAL_METRICS_URL, { cache: "no-store" })
        .then(res => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(data => {
          evalData = data;
          const models = Object.keys(data.models || {});
          if (!models.length) throw new Error("Tidak ada model pada file metrik.");

          if (!models.includes(evalCurrentModel)) {
            evalCurrentModel = models[0];
          }

          renderEvalTabs();
          renderEvalMetrics();
          renderConfusionMatrix();
        })
        .catch(err => {
          const note = document.getElementById("eval-note");
          if (note) {
            note.textContent =
              "Data evaluasi belum tersedia. Jalankan tahap eval pipeline terlebih dahulu. (" +
              err.message +
              ")";
          }
        });
    }

    function renderEvalTabs() {
      const wrap = document.getElementById("eval-tabs");
      if (!wrap || !evalData) return;

      wrap.innerHTML = "";
      Object.keys(evalData.models || {}).forEach(name => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "eval-tab" + (name === evalCurrentModel ? " active" : "");
        btn.textContent = EVAL_MODEL_LABELS[name] || name;
        btn.addEventListener("click", () => {
          evalCurrentModel = name;
          evalNormalized = false;
          const modeToggle = document.getElementById("cm-mode-toggle");
          if (modeToggle) modeToggle.textContent = "Tampilkan Persentase";
          renderEvalTabs();
          renderEvalMetrics();
          renderConfusionMatrix();
        });
        wrap.appendChild(btn);
      });
    }

    function renderEvalMetrics() {
      const wrap = document.getElementById("eval-metrics");
      const metrics = evalData && evalData.models
        ? evalData.models[evalCurrentModel]
        : null;

      if (!wrap || !metrics) {
        if (wrap) wrap.innerHTML = "";
        return;
      }

      const cards = [
        { label: "Akurasi", value: formatPct(metrics.accuracy) },
        { label: "Presisi (macro)", value: formatPct(metrics.precision_macro) },
        { label: "Recall (macro)", value: formatPct(metrics.recall_macro) },
        { label: "F1 (macro)", value: formatPct(metrics.f1_macro) },
        { label: "RMSE Sudut", value: formatNumber(metrics.rmse_angle, 2) + "°" }
      ];

      wrap.innerHTML = "";
      cards.forEach(card => {
        const div = document.createElement("div");
        div.className = "eval-card";
        div.innerHTML =
          `<span class="label">${card.label}</span>` +
          `<span class="value">${card.value}</span>`;
        wrap.appendChild(div);
      });
    }

    function renderConfusionMatrix() {
      const wrap = document.getElementById("cm-wrap");
      const note = document.getElementById("eval-note");
      const metrics = evalData && evalData.models
        ? evalData.models[evalCurrentModel]
        : null;

      if (!wrap || !metrics) {
        if (wrap) wrap.innerHTML = "";
        return;
      }

      const classes = evalData.classes || EVAL_CLASSES_DEFAULT;
      const matrix = evalNormalized
        ? metrics.confusion_matrix_normalized
        : metrics.confusion_matrix;

      if (!matrix) {
        wrap.innerHTML = "";
        return;
      }

      let maxVal = 0;
      matrix.forEach(row => {
        row.forEach(v => {
          const n = Number(v) || 0;
          if (n > maxVal) maxVal = n;
        });
      });
      if (!maxVal) maxVal = 1;

      const table = document.createElement("table");
      table.className = "cm-table";

      const headRow = document.createElement("tr");
      const corner = document.createElement("th");
      corner.className = "cm-axis cm-corner";
      corner.textContent = "Aktual \\ Prediksi";
      headRow.appendChild(corner);

      classes.forEach(c => {
        const th = document.createElement("th");
        th.textContent = c;
        headRow.appendChild(th);
      });
      table.appendChild(headRow);

      matrix.forEach((row, i) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.className = "cm-axis";
        th.textContent = classes[i] || i;
        tr.appendChild(th);

        row.forEach((value, j) => {
          const v = Number(value) || 0;
          const intensity = evalNormalized ? Math.min(v, 1) : v / maxVal;

          const td = document.createElement("td");
          td.textContent = evalNormalized
            ? (v * 100).toFixed(1) + "%"
            : String(v);
          if (i === j) td.className = "cm-diag";

          td.style.background = `rgba(42, 157, 143, ${0.08 + intensity * 0.85})`;
          td.style.color = intensity > 0.55 ? "#ffffff" : "#0f172a";

          const rawRow = metrics.confusion_matrix && metrics.confusion_matrix[i]
            ? metrics.confusion_matrix[i]
            : [];
          const rawCount = Number(rawRow[j] || 0);
          const rowTotal = rawRow.reduce((acc, cur) => acc + Number(cur || 0), 0);
          const pct = rowTotal ? ((rawCount / rowTotal) * 100).toFixed(1) : "0.0";

          td.title =
            `Aktual: ${classes[i]} | Prediksi: ${classes[j]} | ` +
            `Jumlah: ${rawCount} | ${pct}% dari kelas aktual`;

          tr.appendChild(td);
        });

        table.appendChild(tr);
      });

      wrap.innerHTML = "";
      wrap.appendChild(table);

      const meta = evalData.meta || {};
      const skipped = Object.keys(meta.skipped || {});
      let noteText =
        `Dievaluasi pada test set bersama (n_test = ${meta.n_test ?? "-"}, ` +
        `seq_len = ${meta.seq_len ?? "-"}). Baris = arah aktual, kolom = arah ` +
        `prediksi; kotak diagonal = prediksi benar.`;
      if (skipped.length) {
        noteText += ` Model tidak tersedia: ${skipped.join(", ")}.`;
      }
      if (note) note.textContent = noteText;
    }

    // ======================
    // MAIN INIT
    // ======================
    loadRawEvents();
    loadACOEvents();
    loadGAVectors();
    loadROI();
    addLegend();
    initEvalPanel();

    // layer control
    const layersControl = L.control.layers(baseLayers, overlays, {
      collapsed: false
    }).addTo(map);

    // setelah beberapa waktu, coba fitBounds kalau ada data
    setTimeout(() => {
      const combined = combineBounds(boundsAccumulator);
      if (combined) {
        map.fitBounds(combined.pad(0.1));
      }
    }, 1500);
  </script>
</body>
</html>
